# Checks the live API and website every 30 minutes; a failed run sends GitHub's usual failure email to the repo owner.
name: Uptime check

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run checks
        run: node kamgar-connect/scripts/uptime-check.js

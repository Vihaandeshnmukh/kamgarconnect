# Pings the API every 5 minutes so Render's free instance never goes to sleep
# (a sleeping instance takes ~50s to wake, longer than Twilio waits for a call webhook).
name: Keep API awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 90 https://api.kamgar.de/api/health

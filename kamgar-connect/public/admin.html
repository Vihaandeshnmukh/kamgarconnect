<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/config.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — Kamgar Connect</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: var(--bg-base); color: white; padding: 20px; font-family: 'Plus Jakarta Sans', sans-serif; }
    .admin-container { max-width: 1200px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding: 20px; background: var(--bg-surface); border-radius: 12px; border: 1px solid var(--border); }
    .stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
    .stat-card { background: var(--bg-surface); padding: 20px; border-radius: 12px; border: 1px solid var(--border); text-align: center; }
    .stat-card h3 { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; }
    .stat-card p { font-size: 2rem; font-weight: 800; color: var(--accent); }
    
    table { width: 100%; border-collapse: collapse; background: var(--bg-surface); border-radius: 12px; overflow: hidden; margin-bottom: 40px; border: 1px solid var(--border); }
    th { background: rgba(255,255,255,0.03); text-align: left; padding: 15px; font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; }
    td { padding: 15px; border-top: 1px solid var(--border); font-size: 0.9rem; }
    tr:hover { background: rgba(255,255,255,0.02); }
    
    .btn-action { padding: 6px 12px; border-radius: 6px; border: none; font-size: 0.75rem; font-weight: 700; cursor: pointer; margin-right: 5px; }
    .btn-download { background: var(--bg-surface); color: white; border: 1px solid var(--border); padding: 10px 20px; border-radius: 8px; }
    
    .login-overlay { position: fixed; inset: 0; background: var(--bg-base); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .login-box { background: var(--bg-surface); padding: 40px; border-radius: 20px; border: 1px solid var(--border); width: 100%; max-width: 400px; text-align: center; }
    .login-box input { width: 100%; padding: 12px; margin: 20px 0; background: var(--bg-base); border: 1px solid var(--border); border-radius: 8px; color: white; text-align: center; font-size: 1.2rem; }
  </style>
</head>
<body>
  <div id="loginOverlay" class="login-overlay">
    <div class="login-box">
      <h2>Admin Login</h2>
      <input type="password" id="adminPass" placeholder="Enter Password">
      <button onclick="login()" class="btn btn-primary btn-full">Login</button>
    </div>
  </div>

  <div class="admin-container" id="adminContent" style="display: none;">
    <div class="header">
      <h1 style="font-size: 1.5rem;">Admin Dashboard <span class="text-gradient">Kamgar Connect</span></h1>
      <div>
        <button onclick="downloadWorkersCSV()" class="btn-download">Download Workers CSV</button>
        <button onclick="downloadEmployersCSV()" class="btn-download" style="margin-left: 10px;">Download Employers CSV</button>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <h3>Total Workers</h3>
        <p id="totalWorkers">0</p>
      </div>
      <div class="stat-card">
        <h3>Total Employers</h3>
        <p id="totalEmployers">0</p>
      </div>
      <div class="stat-card">
        <h3>Active Assignments</h3>
        <p>0</p>
      </div>
    </div>

    <h2 style="margin-bottom: 20px;">Registered Workers</h2>
    <table id="workerTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>City</th>
          <th>Skill</th>
          <th>Experience</th>
          <th>Salary/Day</th>
          <th>Availability</th>
          <th>Rating</th>
          <th>Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <h2 style="margin-bottom: 20px; margin-top: 60px;">Registered Employers</h2>
    <table id="employerTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>City</th>
          <th>Company</th>
          <th>Worker Type</th>
          <th>Number Needed</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- VIEW REVIEWS MODAL -->
  <div id="reviewsModal" class="login-overlay" style="display:none; z-index:2000;">
    <div class="login-box" style="text-align:left; max-width: 600px; max-height: 80vh; overflow-y: auto;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
        <h2 style="margin:0;">Worker Reviews</h2>
        <button onclick="document.getElementById('reviewsModal').style.display='none'" class="btn-action" style="background:transparent; color:white; font-size:1.5rem; padding:0;">&times;</button>
      </div>
      <div id="reviewsContainer">
        <!-- Reviews go here -->
      </div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script>
    let adminToken = '';
    // Data from the database is shown as text, never as HTML
    const esc = (v) => String(v === undefined || v === null ? '' : v).replace(/[&<>"'`]/g, c => '&#' + c.charCodeAt(0) + ';');

    let workersData = [];
    let employersData = [];

    async function login() {
      const pass = document.getElementById('adminPass').value;
      adminToken = pass;
      loadData();
    }

    async function loadData() {
      try {
        const res = await fetch(`${CONFIG.BACKEND_URL}/api/admin/data`, {
          headers: { 'Authorization': adminToken }
        });
        
        if (!res.ok) {
          alert('Invalid Password');
          return;
        }

        const data = await res.json();
        workersData = data.workers;
        employersData = data.employers;
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('adminContent').style.display = 'block';

        renderTables(data);
      } catch (err) {
        alert('Error loading data');
      }
    }

    function renderTables(data) {
      document.getElementById('totalWorkers').innerText = data.workers.length;
      document.getElementById('totalEmployers').innerText = data.employers.length;

      const wBody = document.querySelector('#workerTable tbody');
      wBody.innerHTML = data.workers.map(w => `
        <tr>
          <td>${esc(w.name)}</td>
          <td>${esc(w.phone)}</td>
          <td>${esc(w.city)}</td>
          <td>${esc(w.skill)}</td>
          <td>${esc(w.experience)}y</td>
          <td>₹${esc(w.expectedSalary || 0)}</td>
          <td>${esc(w.availabilityDays || 7)} Days</td>
          <td>${w.rating > 0 ? w.rating.toFixed(1) + ' ★ (' + w.totalRatings + ')' : 'No reviews'}</td>
          <td>${new Date(w.createdAt).toLocaleDateString()}</td>
          <td>
            <button class="btn-action" style="background:var(--bg-base); color:white; border:1px solid var(--border);" onclick="viewReviews('${w._id}')">REVIEWS</button>
          </td>
        </tr>
      `).join('');

      const eBody = document.querySelector('#employerTable tbody');
      eBody.innerHTML = data.employers.map(e => `
        <tr>
          <td>${esc(e.name)}</td>
          <td>${esc(e.phone)}</td>
          <td>${esc(e.city)}</td>
          <td>${esc(e.companyName || '-')}</td>
          <td>${esc(e.workerType || '-')}</td>
          <td>${esc(e.workerCount || 1)}</td>
          <td>${new Date(e.createdAt).toLocaleDateString()}</td>
        </tr>
      `).join('');
    }

    function downloadWorkersCSV() {
      let csv = 'Name,Phone,City,Skill,Experience,Salary,Availability,Date\n';
      workersData.forEach(w => {
        csv += `${esc(w.name)},${esc(w.phone)},${esc(w.city)},${esc(w.skill)},${esc(w.experience)},${w.expectedSalary},${w.availabilityDays},${new Date(w.createdAt).toLocaleDateString()}\n`;
      });
      downloadBlob(csv, 'workers.csv');
    }

    function downloadEmployersCSV() {
      let csv = 'Name,Phone,City,Company,WorkerType,Count,Date\n';
      employersData.forEach(e => {
        csv += `${esc(e.name)},${esc(e.phone)},${esc(e.city)},${e.companyName},${e.workerType},${e.workerCount},${new Date(e.createdAt).toLocaleDateString()}\n`;
      });
      downloadBlob(csv, 'employers.csv');
    }

    function downloadBlob(content, filename) {
      const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
    }

    async function viewReviews(workerId) {
      document.getElementById('reviewsModal').style.display = 'flex';
      const container = document.getElementById('reviewsContainer');
      container.innerHTML = '<p>Loading reviews...</p>';

      try {
        const res = await fetch(`${CONFIG.BACKEND_URL}/api/reviews/worker/${workerId}`);
        const reviews = await res.json();
        
        if (reviews.length === 0) {
          container.innerHTML = '<p>No reviews yet.</p>';
          return;
        }

        container.innerHTML = reviews.map(r => `
          <div style="background:var(--bg-base); padding:15px; border-radius:12px; margin-bottom:15px; border:1px solid var(--border);">
            <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
              <span style="color:var(--orange-primary); font-size:1.2rem;">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</span>
              <span style="color:var(--text-muted); font-size:0.8rem;">${new Date(r.createdAt).toLocaleDateString()}</span>
            </div>
            ${r.tags && r.tags.length > 0 ? `<div style="display:flex; gap:5px; flex-wrap:wrap; margin-bottom:10px;">
              ${r.tags.map(t => `<span style="background:rgba(255,255,255,0.1); padding:4px 8px; border-radius:20px; font-size:0.7rem;">${esc(t)}</span>`).join('')}
            </div>` : ''}
            ${r.comment ? `<p style="font-size:0.9rem; margin:0; color:var(--text-secondary);">${esc(r.comment)}</p>` : ''}
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<p style="color:#EF4444;">Error loading reviews.</p>';
      }
    }
  </script>
</body>
</html>
